<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
        <meta name="description" content="Gallery Page" />
        <meta name="author" content="Lucky Streak Lounge" />
        <title>Gallery - Lucky Streak Lounge</title>
        <!-- Favicon -->
        <link rel="icon" type="image/x-icon" href="assets/favicon.ico" />
        <!-- Bootstrap CSS -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" />
        <link href="css/styles.css" rel="stylesheet" />
    </head>
    <body>
        <!-- Navigation -->
        <nav class="navbar navbar-expand-lg navbar-light bg-lslgold py-3">
            <div class="container px-5">
                <a class="navbar-brand" href="index.html"><span class="fw-bolder">Lucky Streak Lounge</span></a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button>
                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <ul class="navbar-nav ms-auto mb-2 mb-lg-0 small fw-bolder">
                        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                        <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
                        <li class="nav-item"><a class="nav-link" href="promos.html">Promotions</a></li>
                       <!-- <li class="nav-item"><a class="nav-link" href="specials.html">Specials</a></li>-->
                        <li class="nav-item"><a class="nav-link" href="gallery.html">Gallery</a></li>
                        <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
                    </ul>
                </div>
            </div>
        </nav>

        
        <!-- Gallery Section -->
        <div class="container my-5">
            <div class="d-flex justify-content-center mt-5 mt-xxl-0">
                <div class="aboutUs"><p>Promotions</p></div>
            </div>
            <div class="row g-3">
                <!-- Loop to create 3 rows and 4 columns of thumbnails -->
                <script>
                    const images = [
                        "image1.jpg", "image2.jpg", "image3.jpg", "image4.jpg",
                        "image5.jpg", "image6.jpg", "image7.jpg", "image8.jpg",
                        "image9.jpg", "image10.jpg", "image11.jpg", "image12.jpg"
                    ];
                    document.write('<div class="row">');
                    images.forEach((img, index) => {
                        if (index % 4 === 0 && index !== 0) document.write('</div><div class="row">');
                        document.write(`
                            <div class="col-md-3">
                                <a href="#" data-bs-toggle="modal" data-bs-target="#imageModal" data-bs-image="images/${img}">
                                    <img src="images/${img}" class="img-fluid rounded" alt="Gallery Image ${index + 1}">
                                </a>
                            </div>
                        `);
                    });
                    document.write('</div>');
                </script>
            </div>
        </div>
        
        <!-- Modal -->
        <div class="modal fade" id="imageModal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-lg">
                <div class="modal-content">
                    <div class="modal-body text-center">
                        <img id="modalImage" src="" class="img-fluid" alt="Full Size Image">
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Footer -->
        <footer class="bg-lslgold py-4 mt-auto">
            <div class="container px-5 text-center">
                <div class="small">Copyright &copy; KGD Gegs LLC 2025</div>
            </div>
        </footer>
        
        <!-- Bootstrap JS -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
        <script>
            // Update modal image on thumbnail click
            document.querySelectorAll('[data-bs-toggle="modal"]').forEach(el => {
                el.addEventListener('click', function() {
                    document.getElementById('modalImage').src = this.getAttribute('data-bs-image');
                });
            });
        </script>
    </body>
</html>
