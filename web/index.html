                        <div class="d-flex justify-content-center mt-5 mt-xxl-0">

      <!-- Registration Modal -->
<div class="modal fade" id="myModal" tabindex="-1" aria-labelledby="modalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content p-4">
        <!-- Close button -->
        <div class="modal-header border-0">
          <h5 class="modal-title fw-bold" id="modalLabel">Want exclusive rewards, free play, and your shot at the BIG jackpot?</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form id="contactForm" class="row g-3">
            <div class="col-12">
              <label for="name" class="form-label">Full Name</label>
              <input type="text" class="form-control" id="name" name="name" placeholder="Enter your full name" required>
            </div>
            <div class="col-12">
              <label for="phone" class="form-label">Phone Number</label>
              <input type="tel" class="form-control" id="phone" name="phone" placeholder="Enter your phone number" required>
            </div>
            <div class="col-12">
              <label for="birthdate" class="form-label">Birthdate</label>
              <input type="date" class="form-control" id="birthdate" name="birthdate" required>
            </div>
            <div class="col-12 text-center mt-3">
              <button type="submit" class="btn btn-lg btn-warning fw-bold">Register</button>
            </div>
          </form>
          <p id="statusMessage" class="mt-3 text-center text-success"></p>
        </div>
      </div>
    </div>
  </div>
